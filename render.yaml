services:
  - type: web
    runtime: static
    name: omkar-portfolio
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /google9a637d822aa37f9c.html
        destination: /google9a637d822aa37f9c.html
      - type: rewrite
        source: /llms.txt
        destination: /llms.txt
      - type: rewrite
        source: /ai.txt
        destination: /ai.txt
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /site.webmanifest
        destination: /site.webmanifest
      - type: rewrite
        source: /blog
        destination: /blog/index.html
      - type: rewrite
        source: /blog/:slug
        destination: /blog/:slug.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Security headers
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      # Cache headers
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /certs/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /demos/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=86400
