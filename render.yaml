services:
  - type: web
    runtime: static
    name: omkar-portfolio
    staticPublishPath: .
    routes:
      # ── Static files ──
      - type: rewrite
        source: /google9a637d822aa37f9c.html
        destination: /google9a637d822aa37f9c.html
      - type: rewrite
        source: /llms.txt
        destination: /llms.txt
      - type: rewrite
        source: /ai.txt
        destination: /ai.txt
      - type: rewrite
        source: /humans.txt
        destination: /humans.txt
      - type: rewrite
        source: /.well-known/security.txt
        destination: /.well-known/security.txt
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /site.webmanifest
        destination: /site.webmanifest
      # ── Blog index ──
      - type: rewrite
        source: /blog
        destination: /blog/index.html
      # ── Blog posts (explicit — :slug substitution not reliable on Render static) ──
      - type: rewrite
        source: /blog/what-is-agentic-ai
        destination: /blog/what-is-agentic-ai.html
      - type: rewrite
        source: /blog/voice-cloning-business-india
        destination: /blog/voice-cloning-business-india.html
      - type: rewrite
        source: /blog/prompt-engineering-guide-2026
        destination: /blog/prompt-engineering-guide-2026.html
      - type: rewrite
        source: /blog/ai-workflow-automation-n8n
        destination: /blog/ai-workflow-automation-n8n.html
      - type: rewrite
        source: /blog/ai-customer-service-india
        destination: /blog/ai-customer-service-india.html
      - type: rewrite
        source: /blog/ai-vs-human-customer-service
        destination: /blog/ai-vs-human-customer-service.html
      - type: rewrite
        source: /blog/future-of-work-ai-agents
        destination: /blog/future-of-work-ai-agents.html
      - type: rewrite
        source: /blog/how-to-build-ai-agent-no-code
        destination: /blog/how-to-build-ai-agent-no-code.html
      - type: rewrite
        source: /blog/multilingual-voice-ai-india
        destination: /blog/multilingual-voice-ai-india.html
      - type: rewrite
        source: /blog/ai-creativity-human-art
        destination: /blog/ai-creativity-human-art.html
      - type: rewrite
        source: /blog/36-laws-quiet-power-review
        destination: /blog/36-laws-quiet-power-review.html
      # ── SPA fallback ──
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Security headers
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://cdn.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.clarity.ms; frame-src 'none'; object-src 'none'"
      # Cache headers
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /certs/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /demos/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=86400
